[workspace]
members = [
    "src-tauri",
    "crates/ling-chat-main",
    "crates/ling-chat-plugins",
    "crates/ling-chat-notes",
]
resolver = "2"

# 三个成员共用的包版本。
[workspace.package]
version = "0.5.2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["tokio", "ws"] }
reqwest = { version = "0.13", features = [
    "json",
    "form",
    "multipart",
    "query",
    "stream",
    "rustls",
    "system-proxy",
], default-features = false }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
sea-orm = { version = "1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "ansi",
    "chrono",
] }

# [patch] 与 [profile] 只能放在 workspace 根：成员 crate 里的这两段会被 Cargo 静默忽略。
# patch 路径都相对本文件；esaxx-rs 是上游那份 fork，留在 src-tauri/patches/ 下。
#
# 这里曾经还 patch 过一份 sherpa-onnx-sys（改 build.rs 让它能下官方 CUDA 预编译包），
# 现在删掉了：GPU 变体改成「scripts/fetch-sherpa-onnx-libs.mjs 按版本下好官方包，
# 用 SHERPA_ONNX_LIB_DIR 告诉 cargo」，上游 build.rs 原生支持这个变量，不必再维护副本。
[patch.crates-io]
esaxx-rs = { path = "src-tauri/patches/esaxx-rs" }
jpreprocess-naist-jdic = { git = "https://gh-proxy.org/github.com/shadow01a/jpreprocess", branch = "main" }

# 依赖不生成调试符号。proc-macro 每次指纹变化都要重编，PDB 体积大且无需单步调试。
[profile.dev.build-override]
debug = false

[profile.dev.package."*"]
debug = false
