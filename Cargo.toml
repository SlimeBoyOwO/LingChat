[workspace]
members = [
    "src-tauri",
    "crates/ling-chat-main",
    "crates/ling-chat-plugins",
    "crates/ling-chat-notes",
]
resolver = "2"

# 三个成员共用的包版本。
[workspace.package]
version = "0.5.2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["tokio", "ws"] }
reqwest = { version = "0.13", features = [
    "json",
    "form",
    "multipart",
    "query",
    "stream",
    "rustls",
    "system-proxy",
], default-features = false }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
sea-orm = { version = "1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "ansi",
    "chrono",
] }

# [patch] 与 [profile] 只能放在 workspace 根：成员 crate 里的这两段会被 Cargo 静默忽略。
# patch 路径都相对本文件；esaxx-rs 是上游那份 fork，留在 src-tauri/patches/ 下。
#
# 这里曾经还 patch 过一份 sherpa-onnx-sys（改 build.rs 让它能下官方 GPU 预编译包），
# 现在删掉了：上游 build.rs 原生支持 SHERPA_ONNX_LIB_DIR，准备运行库的活挪到 Cargo 之外
# 的脚本里（Windows 用自编的 DirectML 变体、Android 用自编的 NNAPI 变体，见
# docs/inference-devices.md §9），不必再维护一份副本。
[patch.crates-io]
esaxx-rs = { path = "src-tauri/patches/esaxx-rs" }
jpreprocess-naist-jdic = { git = "https://gh-proxy.org/github.com/shadow01a/jpreprocess", branch = "main" }
# cubecl-wgpu 的源码不进仓库：由 scripts/patch-cubecl-wgpu.mjs 在构建前从 .crate 解包到
# vendor/cubecl-wgpu，并禁用集成 GPU 上会踩野指针的 write_mapped 快路径
# （Android Adreno 上训练必 SIGSEGV，详见脚本注释）。首次克隆或删掉 vendor 目录后，
# 先跑 pnpm patch:cubecl-wgpu，否则 cargo 会因找不到该路径而报错。
cubecl-wgpu = { path = "vendor/cubecl-wgpu" }
# cubek-matmul 的源码同样不进仓库：由 scripts/patch-cubek-matmul.mjs 在构建前解包到
# vendor/cubek-matmul，收紧 Strategy::Auto 的矩阵乘法降级链——Adreno 集成 GPU 共享内存每
# cube 只有 32KB，高级 cmma 内核会超预算，补丁让降级最终落到共享内存最低的 Naive 内核。
cubek-matmul = { path = "vendor/cubek-matmul" }
# wgpu-hal 的源码同样不进仓库：由 scripts/patch-wgpu-hal.mjs 在构建前解包到
# vendor/wgpu-hal，把 Android GLES 下 compute 阶段的 storage buffer 上限改按
# GL_MAX_COMPUTE_SHADER_STORAGE_BLOCKS 上报——Adreno 顶点 stage 只有 4 会拖低整条
# 上报，但 compute 按 GLES 3.1 下限为 8，burn 的卷积内核要 5 个 buffer，见脚本注释。
# 首次克隆或删掉 vendor 目录后，先跑 pnpm patch:wgpu-hal，否则 cargo 报路径错误。
wgpu-hal = { path = "vendor/wgpu-hal" }

# 依赖不生成调试符号。proc-macro 每次指纹变化都要重编，PDB 体积大且无需单步调试。
[profile.dev.build-override]
debug = false

[profile.dev.package."*"]
debug = false
