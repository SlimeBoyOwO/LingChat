[package]
name = "ling_chat"
version = "0.5.0"
default-run = "ling_chat"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ling_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 移动端（Android/iOS）构建时必须启用：让 webview 从应用内嵌资产加载前端
# （不走 devUrl）。桌面端不受影响。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-screenshots = { path = "plugins/tauri-plugin-screenshots" }
tauri-plugin-android-fs = "28"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "chrono"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "multipart", "query", "stream", "rustls", "system-proxy"], default-features = false }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
webpki-roots = "0.26"
futures-util = "0.3"
futures-executor = "0.3"
async-stream = "0.3"
bytes = "1"
regex = "1"
genai = "0.6"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries"] }

sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = ["std"] }
once_cell = "1"
base64 = "0.22"
rand = "0.8"
indoc = "2"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sevenz-rust2 = "0.21"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# LAN Sync
axum = { version = "0.7", features = ["tokio"] }
mdns-sd = "0.11"
if-addrs = "0.13"
tokio-util = { version = "0.7", features = ["io"] }

# Skill Agent：命令输出在中文 Windows 上是 GBK，需要回退解码
encoding_rs = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 插件系统：嵌入 RustPython 跑插件 Python 脚本（目前是一个受限沙箱）。
rustpython-vm = { version = "0.5", default-features = false, features = ["compiler", "gc", "host_env", "stdio", "serde", "freeze-stdlib"] }
rustpython-pylib = { version = "0.5", features = ["freeze-stdlib"] }
rustpython-derive = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }
sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = ["directml"] }
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi"] }


[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["webgpu"] }
sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = ["webgpu"] }
ash = { version = "0.38", default-features = false, features = ["loaded"] }


[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }
sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = ["coreml"] }


# esaxx-rs 强制静态 CRT (/MT) 会在 Windows 下与 ort 等库冲突（LNK2038/LNK2005）。
# 仓库已自带 patches/esaxx-rs（唯一改动：build.rs 去掉 .static_crt(true)，
# 改用动态 CRT /MD），这里把它接到 [patch] 上真正生效。
# 详见 patches/esaxx-rs/build.rs 的注释。
[patch.crates-io]
esaxx-rs = { path = "patches/esaxx-rs" }
jpreprocess-naist-jdic = { git = "https://gh-proxy.org/github.com/shadow01a/jpreprocess", branch = "main" }
