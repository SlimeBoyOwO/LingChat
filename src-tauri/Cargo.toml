[package]
name = "ling_chat"
version = "0.4.6"
default-run = "ling_chat"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ling_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 移动端（Android/iOS）构建时必须启用：让 webview 从应用内嵌资产加载前端
# （不走 devUrl）。桌面端不受影响。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-screenshots = { path = "plugins/tauri-plugin-screenshots" }
tauri-plugin-android-fs = "28"
serde = { version = "1", features = ["derive"] }
# preserve_order 让 serde_json::Map 变成 IndexMap：读进来的 YAML key 顺序原样写回。
# 没有它 Map 是 BTreeMap，编辑器每次自动保存都会把章节里所有事件的字段重排成
# 字典序（type 会跑到 text 后面），git diff 变成全文件级别。
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi", "chrono"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.13", features = ["json", "query", "stream", "rustls", "system-proxy"], default-features = false }
# 用 webpki-roots（内置 Mozilla CA）构造 rustls ClientConfig 注入 reqwest，
# 绕开 reqwest 0.13 默认的 rustls-platform-verifier（Android 上需显式初始化，
# 未初始化会 TLS panic）。版本与 reqwest 0.13.3 的 rustls 依赖保持一致（0.23）。
# aws-lc-rs：与 reqwest 0.13.3 的 provider 一致（否则 rustls 无法自动确定
# CryptoProvider，TLS 握手会 panic）。
rustls = { version = "0.23", features = ["aws-lc-rs"] }
webpki-roots = "0.26"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
regex = "1"
genai = "0.6"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries"] }

sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = ["std"] }
once_cell = "1"
base64 = "0.22"
rand = "0.8"
indoc = "2"

image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sevenz-rust2 = "0.21"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

# LAN Sync
axum = { version = "0.7", features = ["tokio"] }
mdns-sd = "0.11"
if-addrs = "0.13"
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi"] }
