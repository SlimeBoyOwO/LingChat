[profile.dev]
debug = 1
strip = "debuginfo"
split-debuginfo = "unpacked"
lto = false
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
opt-level = "z"

[target.aarch64-linux-android]
linker = "/home/lzx/Android/Sdk/ndk/30.0.15729638/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
rustflags = [
    "-C",
    "link-arg=-Wl,--allow-shlib-undefined",
    "-C",
    "link-arg=-Wl,--unresolved-symbols=ignore-all",
]
