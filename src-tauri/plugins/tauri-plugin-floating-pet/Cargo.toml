[package]
name = "tauri-plugin-floating-pet"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
description = "Android floating pet overlay for LingChat."
build = "build.rs"
links = "tauri-plugin-floating-pet"
exclude = ["target", "android/.gradle/", "android/local.properties", "android/.idea"]

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
