"$schema" = "schemas/schema.json"

# 白名单是**手写**的：`autogenerated/commands/*.toml` 只负责给每个命令生成
# `allow-xxx` 权限文件，真正「放不放行」由这份清单决定。
# 新增 @Command 后如果忘了往这里加，前端调用会被 ACL 直接拒掉
# （报 `plugin floating-pet not allowed`），表现是「点了没反应」——
# 排查时先看这里。
[default]
description = "LingChat 桌宠悬浮窗的默认权限：允许查询能力/授权状态，以及显示与操控悬浮窗。"
permissions = [
    "allow-is-supported",
    "allow-check-permission",
    "allow-request-permission",
    "allow-show",
    "allow-hide",
    "allow-move-pet",
    "allow-set-size",
    "allow-set-touchable",
    "allow-set-expanded",
    "allow-set-scale",
    "allow-is-visible",
    "allow-status",
    # 屏幕截取：进桌宠门禁要查「授权拿到了没」+ 主动拉起系统授权框。
    # `capture-screen` 不在这里——它只由 Rust 侧（`capture_screen_bytes`）
    # 经注入槽调用，不经过 ACL。
    "allow-is-screen-capture-ready",
    "allow-request-screen-capture",
]
