[package]
name = "esaxx-rs"
version = "0.1.10"
authors = ["Nicolas Patry <patry.nicolas@protonmail.com>"]
edition = "2018"
description = "Wrapping around sentencepiece's esaxxx library."
license = "Apache-2.0"
homepage = "https://github.com/Narsil/esaxx-rs"
documentation = "https://docs.rs/esaxx-rs"
repository = "https://github.com/Narsil/esaxx-rs"
readme = "README.md"

# 本地补丁（vendored via [patch.crates-io]）：
# 唯一改动是 build.rs 去掉了 `.static_crt(true)`，让 esaxx 用动态 CRT（/MD）编译，
# 解决与 ort（onnxruntime，/MD）混链导致的 LNK2005/LNK2038/LNK4098 MSVC CRT 冲突。
# 其余文件与 crates.io 上 esaxx-rs 0.1.10 原样一致。

[dependencies]

[build-dependencies]
cc = { version = "1.0", optional = true}

[features]
default = ["cpp"]
cpp = ["cc"]
