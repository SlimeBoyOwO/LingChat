[package]
name = "sbv2_core"
version = "0.2.0"
edition = "2021"
description = "Style-Bert-VITSの推論ライブラリ"
readme = "./README.md"
repository = "https://github.com/neodyland/sbv2-api"
documentation = "https://docs.rs/sbv2_core"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
base64 = { version = "0.22.1", optional = true }
dotenvy = "0.15.7"
env_logger = "0.11.6"
hound = "3.5.1"
jpreprocess = { version = "0.13.2", features = ["naist-jdic"] }
ndarray = "0.17.1"
npyz = { version = "0.8.4", optional = true }
num_cpus = "1.17.0"
once_cell = "1.20.3"
ort = { version = "=2.0.0-rc.13", optional = true }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tar = "0.4.41"
thiserror = "2.0.17"
tokenizers = { version = "0.22.2", default-features = false }
zstd = "0.13.2"

[features]
cuda = ["ort/cuda", "std"]
cuda_tf32 = ["std", "cuda"]
agpl_dict = []
std = ["dep:ort", "tokenizers/progressbar", "tokenizers/onig", "tokenizers/esaxx_fast"]
dynamic = ["ort/load-dynamic", "std"]
directml = ["ort/directml", "std"]
tensorrt = ["ort/tensorrt", "std"]
coreml = ["ort/coreml", "std"]
webgpu = ["ort/webgpu", "std"]
default = ["std", "agpl_dict"]
no_std = ["tokenizers/unstable_wasm"]
aivmx = ["npyz", "base64"]
base64 = ["dep:base64"]

[build-dependencies]
dirs = "6.0.0"
ureq = "3.1.4"

[patch.crates-io]
esaxx-rs = { path = "./vendor/esaxx-rs" }
