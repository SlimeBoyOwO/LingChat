name: 开发版构建测试

on:
  push:
    branches: ["dev", "dev/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "extension/maid_mod/**"
  pull_request:
    branches: ["dev", "dev/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "extension/maid_mod/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            os: windows-latest
          - platform: linux-amd64
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: 恢复 LFS 对象缓存
        # 只缓存对象、不代替拉取；命中缓存时 git lfs pull 不再走网络
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: ${{ runner.os }}-lfs-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: 拉取 LFS 资源
        # checkout(lfs: false) 后手动拉取，与 build-android.yml / build-ios.yml 同一套。
        # 必须覆盖全部 LFS 目录：
        # - src-tauri/icons/**：tauri-build 要把 icon.ico 编进 Windows exe，是指针就会失败/编出占位图标
        # - public/** + src/assets/**：vite 会拷进 dist（漏拉就是一堆指针文本，字体/背景/提示图全丢）
        # - data/**：进 .bundled_resources 与 data_manifest.json
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include="data/**,public/**,src/assets/**,src-tauri/icons/**"
          # 指针文件 = 真实内容没下来，直接失败，别让它混进产物
          pointers=$(grep -rlI 'git-lfs.github.com/spec' data public src/assets src-tauri/icons 2>/dev/null | head -5 || true)
          if [ -n "$pointers" ]; then
            echo "::error::以下文件仍是 Git LFS 指针（真实内容没拉下来）："
            echo "$pointers"
            exit 1
          fi
          echo "✓ LFS 资源已就位：$(du -sh data public src/assets src-tauri/icons 2>/dev/null | tr '\n' ' ')"

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: 安装 rust
        uses: dtolnay/rust-toolchain@stable

      - name: 设置 rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: 安装 Linux 依赖 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y eatmydata
          sudo eatmydata apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libwayland-dev \
            libdbus-1-dev \
            mold

      # 图标不再用 PIL 画占位图：那套 hack 是「lfs: false 导致图标只是 LFS 指针」时代的补救
      # （icon.png 是指针时 tauri icon 会失败，所以先用 PIL 画一张 1024x1024 蓝圆再 tauri icon）。
      # 现在上面已经 git lfs pull 了 src-tauri/icons/**，用仓库里的真图标即可。
      # 本流程只做编译测试、不产出安装包，所以不需要 pnpm run init 下载 emotion/embedding 模型。
      - name: 创建占位文件
        shell: bash
        run: |
          rm -rf src-tauri/tauri.windows.conf.json
          mkdir -p data/.official/game_data
          mkdir -p data/third_party
          touch data/.official/game_data/.gitkeep
          touch data/third_party/.gitkeep
          node scripts/prepare-desktop-resources.mjs

      - name: 构建应用
        env:
          RUSTFLAGS: |
            ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
            ${{ runner.os == 'Windows' && '-C linker=rust-lld' || '' }}
            ${{ runner.os == 'macOS' && '' || '' }}
        run: |
          pnpm build
          cargo build
