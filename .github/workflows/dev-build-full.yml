name: 构建开发版（全量测试）

on:
  push:
    branches: ['dev', 'dev/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  pull_request:
    branches: ['dev', 'dev/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows-amd64
          - windows-dev-host

jobs:
  build:
    env:
      DATA_VERSION: ${{ github.run_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows-dev-host' && '[{"platform":"windows-dev-host","os":"windows-latest","artifact-name":"lingchat-windows-dev-host","artifact-path":"src-tauri/target/debug/ling_chat.exe"}]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'windows-amd64' && '[{"platform":"windows-amd64","os":"windows-latest","artifact-name":"lingchat-dev-windows-installer","artifact-path":"src-tauri/target/release/bundle/nsis/*.exe"}]' || '[{"platform":"windows-amd64","os":"windows-latest","artifact-name":"lingchat-dev-windows-installer","artifact-path":"src-tauri/target/release/bundle/nsis/*.exe"},{"platform":"linux-amd64","os":"ubuntu-latest","artifact-name":"lingchat-dev-linux-amd64","artifact-path":"src-tauri/target/release/ling_chat"},{"platform":"macos","os":"macos-latest","artifact-name":"lingchat-dev-macos","artifact-path":"src-tauri/target/release/ling_chat"},{"platform":"linux-aarch64","os":"ubuntu-24.04-arm","artifact-name":"lingchat-dev-linux-aarch64","artifact-path":"src-tauri/target/release/ling_chat"}]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: 安装 rust
        uses: dtolnay/rust-toolchain@stable

      - name: 设置 rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: 安装 Linux 依赖 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libwayland-dev \
            libdbus-1-dev \
            mold

      - name: 创建占位文件和初始化
        shell: bash
        run: |
          mkdir -p data/.official/game_data
          mkdir -p data/third_party
          touch data/.official/game_data/.gitkeep
          touch data/third_party/.gitkeep
          node scripts/prepare-desktop-resources.mjs
          pip install Pillow
          rm -rf ./src-tauri/icons/icon.png
          python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (1024,1024), color='#4A90D9'); draw=ImageDraw.Draw(img); draw.ellipse((100,100,924,924), fill='#2C3E50'); img.save('./src-tauri/icons/icon.png')"
          pnpm tauri icon ./src-tauri/icons/icon.png

      - name: 测试 Dev Host 合同
        if: matrix.platform == 'windows-dev-host'
        env:
          RUSTFLAGS: -C linker=rust-lld
        shell: bash
        run: |
          pnpm test:live2d
          cargo test --manifest-path src-tauri/Cargo.toml --lib api::live2d::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib api::character::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib init::static_copy::tests

      - name: 构建 Windows Dev Host
        if: matrix.platform == 'windows-dev-host'
        env:
          RUSTFLAGS: -C linker=rust-lld
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked

      - name: 构建 Windows 安装包
        if: matrix.platform == 'windows-amd64'
        env:
          RUSTFLAGS: -C linker=rust-lld
        shell: bash
        run: >-
          pnpm tauri build --ci --no-sign --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 构建应用
        if: runner.os != 'Windows'
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
        run: pnpm tauri build --no-bundle

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 7
