name: 安卓发行版构建

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag 名称"
        required: true
        type: string
        default: "v0.0.0"
      release_title:
        description: "Release 标题（仅新建时生效）"
        required: false
        type: string
        default: "开发版构建"
      is_prerelease:
        description: "是否标记为预发布版本（仅新建时生效）"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
      CARGO_PROFILE_RELEASE_STRIP: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 设置 rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: 安装 Linux 依赖 (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install eatmydata
          sudo eatmydata apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libwayland-dev \
            libdbus-1-dev \
            zip

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: 生成图标
        run: |
          git lfs pull src-tauri/icons/icon.png
          pnpm run init

      - name: 准备 Android 项目
        run: pnpm android:prepare

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties', 'src-tauri/gen/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 配置 Android 签名
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > $HOME/upload-keystore.p12
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=$HOME/upload-keystore.p12
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: 构建 Android APK
        run: pnpm android:build

      - name: 校验打进包里的 sherpa 是 NNAPI 版
        # `pnpm android:build` 默认会自编 NNAPI 版 sherpa（约十几分钟）；但如果前置条件
        # （NDK/cmake）缺失，脚本会安静回落到官方 CPU 包。发行版不能打出「假 GPU 包」，
        # 所以对已经进 jniLibs 的那份 .so 再验一次：自编版含 "Use nnapi"，官方 CPU 包
        # 只含 "Android NNAPI requires API level >= 27" 那段回落提示。
        run: |
          LIB="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so"
          test -f "$LIB" || { echo "::error::找不到 $LIB"; exit 1; }
          if ! strings "$LIB" | grep -q "Use nnapi"; then
            echo "::error::$LIB 里没有 NNAPI 初始化代码，打进包的是 CPU 版 sherpa"
            exit 1
          fi
          if strings "$LIB" | grep -q "Android NNAPI requires API level >= 27"; then
            echo "::error::$LIB 是官方预编译包（按 android-21 编的），NNAPI 那段被编掉了"
            exit 1
          fi
          echo "✓ NNAPI 版 sherpa 已进包"

      - name: 重命名 APK
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          ORIGINAL_APK="$APK_DIR/app-universal-release-unsigned.apk"

          if [[ -f "$ORIGINAL_APK" ]]; then
            NEW_NAME="LingChat-${VERSION}-universal.apk"
            mv "$ORIGINAL_APK" "$APK_DIR/$NEW_NAME"
            echo "APK 已重命名为: $NEW_NAME"
          else
            echo "未找到 APK 文件，跳过重命名"
          fi

      - name: 手动签名 APK
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/LingChat-${VERSION}-universal.apk"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | head -1)

          $APKSIGNER sign \
            --ks $HOME/upload-keystore.p12 \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            "$APK_PATH"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 创建或更新 Release
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/LingChat-${TAG}-universal.apk"

          if gh release view "$TAG" &>/dev/null; then
            echo "📦 Release $TAG 已存在，上传 APK..."
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            echo "✨ 创建新 Release: $TAG"

            CMD="gh release create \"$TAG\" \"$APK_PATH\" --generate-notes"

            if [[ -n "${{ github.event.inputs.release_title }}" ]]; then
              CMD="$CMD --title \"${{ github.event.inputs.release_title }}\""
            fi

            if [[ "${{ github.event.inputs.is_prerelease }}" == "true" ]]; then
              CMD="$CMD --prerelease"
            fi

            eval $CMD
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
