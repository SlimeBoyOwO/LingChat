name: 安卓开发版构建

on:
  # push:
  #  branches: ['dev/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 冷编译大头在 cargo（依赖全量编译 ~60min）。env 覆盖 release profile 加速，
    # 不改 Cargo.toml（本地构建不受影响）。opt-level 3→2 快 20-30%，运行时性能略降。
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      CARGO_PROFILE_RELEASE_STRIP: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm' # 已自动缓存 pnpm store，无需额外 actions/cache

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
            #  armv7-linux-androideabi
            #  i686-linux-android
            #  x86_64-linux-android

      - name: 设置 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
          cache-targets: true
          shared-key: ${{ runner.os }}-main-pnpm-tauri-build-android
          # 编译失败也保存已编好的依赖缓存，下次迭代不用全量重编
          cache-on-failure: true

      - name: 安装 Linux 依赖 (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install eatmydata
          sudo eatmydata apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libwayland-dev \
            libdbus-1-dev \
            zip

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: pnpm 安装依赖
        run: pnpm i --frozen-lockfile

      - name: 生成图标
        run: |
          git lfs pull src-tauri/icons/icon.png
          pnpm run init

      - name: 准备 Android 项目
        run: |
          pnpm android:prepare

      # gradle 依赖在 android:prepare 之后才生成（src-tauri/gen/android），缓存放这里
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties', 'src-tauri/gen/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # tauri android 会通过 sdkmanager 装缺的 NDK/build-tools 到 /usr/local/lib/android/sdk，
      # 缓存它省掉每次数 GB 下载。注意体积（repo 缓存上限 10GB），若与 Rust 缓存冲突可去掉。
      - name: 缓存 Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('src-tauri/gen/android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: 配置 Android 签名
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > $HOME/upload-keystore.p12
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=$HOME/upload-keystore.p12
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF
          
      - name: 构建 Android APK
        run: pnpm android:build
        
      - name: 手动签名 APK
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | head -1)
          
          $APKSIGNER sign \
            --ks $HOME/upload-keystore.p12 \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            "$APK_PATH"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 上传 artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: lingchat-dev-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          retention-days: 7
