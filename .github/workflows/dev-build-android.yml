name: 安卓测试版构建

on:
  # push:
  #  branches: ['dev/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      CARGO_PROFILE_RELEASE_STRIP: "true"

    steps:
      # 测试版也要出「能用的包」：resources 来自两层——
      #   1) Git LFS：checkout 默认只给 LFS 指针（不是内容），不拉的话 data.7z 会只剩 1.8 MB 空壳
      #   2) pnpm run init：data/third_party 的 emotion/embedding 模型不在 git 里，必须现场下载
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: 恢复 LFS 对象缓存
        # 只缓存对象、不代替拉取；命中缓存时 git lfs pull 不再走网络
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: ${{ runner.os }}-lfs-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: 拉取 LFS 数据
        run: |
          set -euo pipefail
          git lfs pull --include="data/**,public/**,src/assets/**,src-tauri/icons/**"
          # 指针文件 = 真实内容没下来，直接失败，别让它混进包里
          pointers=$(grep -rlI 'git-lfs.github.com/spec' data public src/assets 2>/dev/null | head -5 || true)
          if [ -n "$pointers" ]; then
            echo "::error::以下文件仍是 Git LFS 指针（真实内容没拉下来）："
            echo "$pointers"
            exit 1
          fi
          echo "✓ LFS 数据已就位：$(du -sh data public src/assets 2>/dev/null | tr '\n' ' ')"

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets:
            aarch64-linux-android
            #  armv7-linux-androideabi
            #  i686-linux-android
            #  x86_64-linux-android

      - name: 设置 rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: 安装 Linux 依赖 (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install eatmydata
          sudo eatmydata apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libwayland-dev \
            libdbus-1-dev \
            zip

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: 创建占位文件
        shell: bash
        run: |
          mkdir -p data/.official/game_data
          mkdir -p data/third_party
          touch data/.official/game_data/.gitkeep
          touch data/third_party/.gitkeep
          node scripts/prepare-desktop-resources.mjs
          pip install Pillow
          rm -rf ./src-tauri/icons/icon.png
          python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (1024,1024), color='#4A90D9'); draw=ImageDraw.Draw(img); draw.ellipse((100,100,924,924), fill='#2C3E50'); img.save('./src-tauri/icons/icon.png')"
          pnpm tauri icon ./src-tauri/icons/icon.png

      - name: 下载运行时模型
        # data/third_party 的 emotion/embedding 模型不进 git（.gitignore 的 data/**），
        # 必须靠 pnpm run init 现场下载，否则打进包的 AI 功能是缺模型的。
        # 与 build-android.yml（发行版）保持一致。
        run: pnpm run init

      - name: 准备 Android 项目
        run: |
          pnpm android:prepare

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties', 'src-tauri/gen/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 配置 Android 签名
        # secrets 通过 env 传给 shell：直接内联进命令行时，空值会把下一个选项吞成参数值
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/upload-keystore.p12"
          if [ -n "${KEY_BASE64:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "🔑 使用仓库 secrets 里的签名密钥"
            printf '%s' "$KEY_BASE64" | base64 -d > "$KS"
          else
            echo "::warning::未配置 ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEYSTORE_PASSWORD，本次测试包改用临时调试密钥签名（无法覆盖安装正式版）"
            KEY_ALIAS="lingchat-dev-debug"
            KEY_PASSWORD="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=LingChat Dev, OU=CI, O=LingChat, L=Unknown, ST=Unknown, C=CN"
          fi
          [ -s "$KS" ] || { echo "::error::$KS 是空文件，ANDROID_KEY_BASE64 可能不是有效的 base64"; exit 1; }
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          # 兼容按 Tauri 约定读取该文件的 Gradle 配置（本仓库目前没有引用）
          printf 'storeFile=%s\nkeyAlias=%s\npassword=%s\n' "$KS" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > src-tauri/gen/android/keystore.properties

      - name: 构建 Android APK
        run: pnpm android:build

      - name: 校验打进包的 data.7z 不是空壳
        # CI 最容易踩的坑：资源没拉全时它照样能构建成功，只是包里没有数据和模型。
        # 正常约 84 MB；只有 ~2 MB 就说明 data/ 的真实内容没打进包。
        run: |
          set -euo pipefail
          DATA7Z="src-tauri/gen/android/app/src/main/assets/data/data.7z"
          test -f "$DATA7Z" || { echo "::error::找不到 $DATA7Z"; exit 1; }
          SZ=$(stat -c%s "$DATA7Z")
          echo "data.7z 大小: $((SZ/1048576)) MB"
          if [ "$SZ" -lt 20000000 ]; then
            echo "::error::$DATA7Z 只有 $((SZ/1048576)) MB，游戏数据是空壳：检查 LFS 拉取（git lfs pull）与 pnpm run init 是否真的跑了"
            exit 1
          fi
          echo "✓ 游戏数据已进包"

      - name: 校验打进包里的 sherpa 是 NNAPI 版
        # `pnpm android:build` 默认会自编 NNAPI 版 sherpa（约十几分钟）；但如果前置条件
        # （NDK/cmake）缺失，脚本会安静回落到官方 CPU 包。测试版同样需要这份看门狗，
        # 否则会误把「CPU 版 sherpa 的包」当成 GPU 验证通过：自编版含 "Use nnapi"，
        # 官方 CPU 包只含 "Android NNAPI requires API level >= 27" 那段回落提示。
        run: |
          LIB="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so"
          test -f "$LIB" || { echo "::error::找不到 $LIB"; exit 1; }
          if ! strings "$LIB" | grep -q "Use nnapi"; then
            echo "::error::$LIB 里没有 NNAPI 初始化代码，打进包的是 CPU 版 sherpa"
            exit 1
          fi
          if strings "$LIB" | grep -q "Android NNAPI requires API level >= 27"; then
            echo "::error::$LIB 是官方预编译包（按 android-21 编的），NNAPI 那段被编掉了"
            exit 1
          fi
          echo "✓ NNAPI 版 sherpa 已进包"

      - name: 手动签名 APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          [ -f "$APK_PATH" ] || { echo "::error::找不到 APK：$APK_PATH"; exit 1; }
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::在 $ANDROID_HOME 下找不到 apksigner"; exit 1; }
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$APK_PATH"
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: 上传 artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: lingchat-dev-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          retention-days: 7
