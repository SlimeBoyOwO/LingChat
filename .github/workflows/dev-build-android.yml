name: 安卓测试版构建

on:
  push:
    branches: ['dev', 'dev/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '0'
      CARGO_PROFILE_RELEASE_STRIP: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # data/ 资源由 git LFS 追踪，必须拉取才能打进 APK
          lfs: true

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets:
            aarch64-linux-android
            #  armv7-linux-androideabi
            #  i686-linux-android
            #  x86_64-linux-android

      - name: 设置 rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: 安装 Linux 依赖 (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install eatmydata
          sudo eatmydata apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libwayland-dev \
            libdbus-1-dev \
            zip

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      
      - name: 创建占位文件
        shell: bash
        run: |
          mkdir -p data/.official/game_data
          mkdir -p data/third_party
          touch data/.official/game_data/.gitkeep
          touch data/third_party/.gitkeep
          node scripts/prepare-desktop-resources.mjs
          pip install Pillow
          rm -rf ./src-tauri/icons/icon.png
          python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (1024,1024), color='#4A90D9'); draw=ImageDraw.Draw(img); draw.ellipse((100,100,924,924), fill='#2C3E50'); img.save('./src-tauri/icons/icon.png')"
          pnpm tauri icon ./src-tauri/icons/icon.png

      - name: 准备 Android 项目
        run: |
          pnpm android:prepare

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties', 'src-tauri/gen/android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 配置 Android 签名（有 secrets 才执行）
        if: ${{ env.ANDROID_KEY_B64 != '' }}
        env:
          ANDROID_KEY_B64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          echo "$ANDROID_KEY_B64" | base64 -d > $HOME/upload-keystore.p12
          cat > src-tauri/gen/android/keystore.properties << EOF
          storeFile=$HOME/upload-keystore.p12
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      # debug variant：gradle 自动用 debug keystore 签名，无需 secrets 即可安装
      - name: 构建 Android APK (debug)
        run: pnpm android:build -- --debug

      # dev 构建没有 secrets 时跳过手动签名，上传自动签名的 debug APK
      - name: 手动签名 APK
        if: ${{ env.ANDROID_KEY_B64 != '' }}
        continue-on-error: true
        env:
          ANDROID_KEY_B64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          VERSION="${{ github.event.inputs.tag_name }}"
          APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | head -1)
          $APKSIGNER sign \
            --ks $HOME/upload-keystore.p12 \
            --ks-key-alias ${{ secrets.ANDROID_KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            "$APK_PATH"

      - name: 上传 artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: lingchat-dev-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          retention-days: 7
