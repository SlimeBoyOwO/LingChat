name: build-926-release

on:
  push:
    branches: ["fix/issue-926-clean"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: pnpm/setup@v1
        with:
          runtime: node@26
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: build-926-debug
          workspaces: |
            .
          save-if: false

      - name: 创建占位文件和初始化
        shell: bash
        run: |
          rm -rf src-tauri/tauri.windows.conf.json
          mkdir -p data/.official/game_data
          mkdir -p data/third_party
          touch data/.official/game_data/.gitkeep
          touch data/third_party/.gitkeep
          node scripts/prepare-desktop-resources.mjs
          pip install Pillow
          rm -rf ./src-tauri/icons/icon.png
          python -c "from PIL import Image, ImageDraw; img=Image.new('RGB', (1024,1024), color='#4A90D9'); draw=ImageDraw.Draw(img); draw.ellipse((100,100,924,924), fill='#2C3E50'); img.save('./src-tauri/icons/icon.png')"
          pnpm tauri icon ./src-tauri/icons/icon.png

      - name: 构建 release 应用（带调试信息，data 走 exe 同目录）
        env:
          RUSTFLAGS: "-C linker=rust-lld -C debuginfo=2"
        run: pnpm tauri build --no-bundle

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingchat-926-release-windows
          path: target/release/ling_chat.exe
          retention-days: 7
