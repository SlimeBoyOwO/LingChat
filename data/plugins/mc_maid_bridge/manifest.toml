id = "mc_maid_bridge"
name = "车万女仆桥接"
description = "把《车万女仆》桥接模组接进对话：MC 里主人说的话进对话，角色回的话变成游戏内女仆气泡，还能指挥女仆走过去、坐下、躺下、到前面探路、换工作模式（种菜、钓鱼、打怪）、打指定的活物（包括另一个玩家）、挖方块、放方块、在头上顶东西，并让她知道自己身边有什么、捡到了什么、上下船与进了什么结构、被 Carry On 抱起来、她自己死了还是复活了、主人拿出了她最爱吃的什么，以及主人拿到了什么成就"
version = "0.1.0"
author = "LingChat"

# 顶层键必须写在第一个表之前，否则会被解析成那个表的字段。
# MC 里玩家说的话要当成玩家发言送进对话。
send_user_message = true

# 游戏里的变化攒够了，要请角色主动开口（会花掉一轮生成）。
trigger_proactive = true

# 玩家在游戏里说话时，让角色可以「看一眼玩家的屏幕」（maid_see_screen 工具）——
# 她要知道你搭的爱心是什么形状，光靠文字说不出来。屏幕上是玩家的隐私，所以单独声明。
capture_screen = true

# 桥接模组只在本机回环上监听，白名单也只放行回环，避免这个插件被指向任意外部地址。
ws_allow = ["ws://127.0.0.1:", "ws://localhost:"]

# 游戏内播放 TTS 时要读 data/voice 下宿主生成的音频文件。
read = ["voice"]

[[config]]
key = "ws_url"
label = "桥接模组地址"
kind = "string"
required = false
default = "ws://127.0.0.1:48920"
hint = "与模组默认一致，一般不用改；模组改过端口才需要动。"

[[config]]
key = "maid_id"
label = "女仆 UUID"
kind = "string"
required = false
hint = "留空则每次用到都现问一遍游戏（每句话多一次往返，游戏暂停时最长等满 5 秒）。建议从模组面板复制填上。"

[[config]]
key = "player_name"
label = "你在 MC 里的用户名"
kind = "string"
required = false
hint = "比如 NoiQing_Ling。填上之后：你在 MC 里说的话不会再带上这个账号名（模型只该认得设置里那个用户名）；女仆的主人另有其人时，聊天里才会点名。\n留空也能用：事件旁白只用 LingChat 里的角色名与用户名，不再出现 MC 账号名。"

[[config]]
key = "favorite_food"
label = "她最喜欢吃的东西"
kind = "string"
required = false
hint = "填物品 id，多个用逗号隔开；命名空间可以省略（cake 就是 minecraft:cake），写了模组前缀（如 farmersdelight:cooked_rice）就按那个认。\n主人把它拿在主手上时她会像见到蛋糕一样凑过来讨。毒马铃薯、河豚这类带负面效果的食物不算。\n改完在下一次游戏里说话（或重连）时生效。"

[[config]]
key = "echo_to_game"
label = "把角色的话同步成游戏内气泡"
kind = "boolean"
required = false
default = true

[[config]]
key = "play_voice_in_game"
label = "游戏内播放 TTS 语音"
kind = "boolean"
required = false
default = false
hint = "开启后，连上 MC 时这句话的语音改由女仆在游戏里的位置播放，LingChat 本机静音；\nMC 没连上或断开时自动回到本机播放。"

[[config]]
key = "screen_window"
label = "游戏窗口标题关键词"
kind = "string"
required = false
default = "Minecraft"
hint = "「看一眼玩家屏幕」时按窗口标题（或进程名）找游戏窗口，找不到就抓整个屏幕。\n只有窗口标题被改过、或者非原版启动器时才需要动这一项。"

[[config]]
key = "proactive_after_events"
label = "攒够几条游戏事件让角色先开口"
kind = "number"
required = false
default = 3
hint = "游戏里的变化（换地形、天黑、下雨、受伤这类）会记成旁白；连着攒够这么多条、\n且这期间没人说话，就请角色主动说一句。填 0 = 只记旁白，不主动开口。\n只在设置里开着「主动对话系统」时才有效。"

# 接管宿主台词语音的播放：上面的开关打开且 tlm 连接在线时，本机静音，
# 由插件把音频转发给模组在游戏里播放。
[voice_playback]
config = "play_voice_in_game"
ws_conn = "tlm"

[[ws]]
id = "tlm"
mode = "client"
url = "ws://127.0.0.1:48920"
auto_reconnect = true
script = "hooks.py"
handler = "on_ws"

# 订阅「这一句上屏了」而不是「这一句生成好了」：模型的回复是流式到达的，几条会
# 挤在一起生成完；跟着上屏时机走，游戏里的女仆才会跟着主界面一句一句地冒话。
[[subscribe]]
signal = "line_shown"
script = "hooks.py"
handler = "on_line_shown"

# 动作、工作模式、攻击、挖掘、放置与查询：让 LLM 指挥游戏里的女仆走过去、坐下、躺床、
# 换工作、打指定的活物、挖方块、放方块，或问一句她周围有什么。
# 这些工具都指向 tools/entry.py（一个脚本可挂多个入口，按行为分模块在 tools/ 下）。
# examples 是 Tool RAG 的检索语料（没配才回退到描述）；描述只讲功能与参数，
# 不枚举返回与失败的各种情况——那些由工具回执与事件旁白交代。
# 「看向玩家」不在这里：她说话时由模组自己转头，不需要模型下指令。
[[tools]]
name = "maid_go_to"
examples = ["过来一下", "到我身边来", "走到我旁边", "来我这儿"]
description = "让自己走到主人身边或最近的床边。target 选 player（主人，默认）或 bed（最近的床）。走路要花点时间，返回时通常还在路上；探路时用 target=player 叫她回来。"
parameters = '{ "type":"object", "properties":{ "target":{ "type":"string", "enum":["player","bed"], "description":"player = 走到主人身边（默认）；bed = 走到最近的床边" } } }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_sit_down"
examples = ["坐下吧", "你坐下休息会", "坐我旁边", "先坐下来"]
description = "让自己坐下。坐下后不会自己走动，恢复行动用 maid_stand_up。"
parameters = '{ "type":"object", "properties":{} }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_stand_up"
examples = ["站起来", "别坐了", "起来吧", "起身跟我走"]
description = "让自己站起来。她坐着、躺着、睡着，或者下不来座位时用它恢复行动；与 maid_sit_down 相对。"
parameters = '{ "type":"object", "properties":{} }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_lie_down"
examples = ["去床上睡觉", "躺下休息", "去睡觉", "躺在床上睡一会"]
description = "让自己躺下。target 选 bed（默认，就近找一张空床，走到床头躺下，躺着每 10 秒回一滴血）或 ground（就地躺下，不回血）。起来用 maid_stand_up。"
parameters = '{ "type":"object", "properties":{ "target":{ "type":"string", "enum":["bed","ground"], "description":"bed = 走到最近的床上（默认）；ground = 就地躺下" } } }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_scout"
examples = ["去前面探路", "帮我开路", "走前面去", "看看前面有什么"]
description = "走到主人前面替主人开路、探路，会跟着主人的朝向换地方，这段时间不会被拽回主人身边。回来用 maid_go_to，就地停下用 maid_stand_up。"
parameters = '{ "type":"object", "properties":{} }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_set_task"
examples = ["去种地吧", "去钓鱼", "别干活了", "去打怪吧"]
description = "切换自己的工作模式，也就是接下来自己会去干什么活。task 填中文名或英文短名，完整列表见参数说明。什么时候真去干看她的作息。"
parameters = '{ "type":"object", "properties":{ "task":{ "type":"string", "description":"工作模式，中文名或英文短名：农场 farm、钓鱼 fishing、攻击 attack、弓兵 ranged_attack、弩兵 crossbow_attack、弹幕 danmaku_attack、三叉戟 trident_attack、甘蔗 sugar_cane、瓜类 melon、可可 cocoa、采蜜 honey、花草 grass、清雪 snow、喂食 feed、剪刀 shears、牛奶 milk、火把 torch、繁殖 feed_animal、灭火 extinguishing、游戏 board_games、空闲 idle" } }, "required":["task"] }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_attack"
examples = ["去打那只僵尸", "揍它", "打我一下", "轻轻拍我一下"]
description = "让自己去攻击身边的活物，可以一次点好几只。target 写活物的中文名、英文短名或实体 id、另一个玩家的名字，或 hostile（最近的敌对生物）、animal（最近的动物）、other_player、owner。count 默认 1、最多 8，按最近的顺序一只一只打。style 选 fight（默认，追着打到倒下）或 light（只轻轻打一下，伤害很小）。"
parameters = '{ "type":"object", "properties":{ "target":{ "type":"string", "description":"要打谁：活物名字、英文短名、实体 id、另一个玩家的名字，或 hostile / animal / other_player / owner" }, "count":{ "type":"integer", "minimum":1, "maximum":8, "description":"要打几只（默认 1，最多 8）；按最近的顺序一只一只打" }, "style":{ "type":"string", "description":"fight = 追着打倒（默认）；light = 只轻轻打一下" } }, "required":["target"] }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_mine"
examples = ["把这块挖了", "去挖点石头", "帮我挖矿", "挖三个木头", "把这堵墙拆了", "把这一片都拆了"]
description = "让自己去挖方块。target 写方块的中文名或英文 id（石头、圆石、木头、铁矿……），或 looked（主人准星指着的地方，省略也是它）；写「木头」按附近实际的原木算，写铁矿、煤矿会把深层变体一起算。count 默认 1、最多 64。填 at 就挖 maid_look_around 给出的那一格；whole=true 把 at 那一团同种方块整团拆掉；area 给两个相对角拆一片长方体。后两种一次最多 64 块。掉落进她的背包。"
parameters = '{ "type":"object", "properties":{ "target":{ "type":"string", "description":"方块中文名、英文 id，或 looked（主人准星指着的方向；省略也是它）" }, "count":{ "type":"integer", "minimum":1, "maximum":64, "description":"要挖几块（默认 1，最多 64）" }, "at":{ "type":"string", "description":"maid_look_around 给出的相对地址，形如 @4,-2,-3（相对自己脚下那一格）；填了就挖那一格，target 只用来核对种类" }, "whole":{ "type":"boolean", "description":"true = 把 at（或准星指着）那一团同种方块整团拆掉；一次最多 64 块" }, "area":{ "type":"string", "description":"一片长方体的两个相对角，用空格或 ~ 分开，如 @-3,0,2 @3,3,4（相对自己脚下那一格）；填了就拆这片里能拆的方块，一次最多 64 块、每条边最多 16 格" } } }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_place"
examples = ["在这放个石头", "把这块木板放上", "往那格放玻璃", "帮我插个火把"]
description = "让自己把背包里的一块方块放到指定位置。item 写方块的中文名或英文 id（石头、橡木木板、玻璃……）。不填 at 就按主人准星指着的那一面放；填 at 就放那一格（相对她脚下，形如 @3,1,1）。facing 选 north / south / east / west，楼梯、原木这类有朝向的方块才需要，省略按她自己的朝向。"
parameters = '{ "type":"object", "properties":{ "item":{ "type":"string", "description":"方块中文名或英文 id（如 石头、minecraft:stone）" }, "at":{ "type":"string", "description":"要放的空格子的相对地址，形如 @3,1,1（相对她脚下那一格）；省略就按主人准星指着的那一面放" }, "facing":{ "type":"string", "enum":["north","south","east","west"], "description":"楼梯、原木这类有朝向的方块朝哪边；省略按她自己的朝向" } }, "required":["item"] }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_give_item"
examples = ["把铁镐给我", "给我点吃的", "把你背包里的东西给我", "递我两个面包"]
description = "让自己把背包里的东西交给主人。item 写物品的中文名、英文 id 或「看一眼周围」里拿到的 id，count 默认 1、最多 64。装不下的掉在主人脚下。"
parameters = '{ "type":"object", "properties":{ "item":{ "type":"string", "description":"物品中文名或英文 id（如 铁镐、minecraft:iron_pickaxe）" }, "count":{ "type":"integer", "minimum":1, "maximum":64, "description":"要交几件（默认 1，最多 64）" } }, "required":["item"] }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_headwear"
examples = ["把这块石头顶在头上", "戴个南瓜", "摘下来", "头上的东西拿下来"]
description = "把自己背包里的一件东西戴到头上，或者把头上的摘下来。item 写物品的中文名或英文 id；留空或写 take_off 就是摘下来，摘下的放回背包。"
parameters = '{ "type":"object", "properties":{ "item":{ "type":"string", "description":"要戴的东西（物品中文名或英文 id，必须在她背包里）；留空或 take_off = 摘下来" } } }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_look_around"
examples = ["你周围有什么", "你看到什么了", "身边有什么东西", "你现在在哪"]
description = "看一眼自己身边现在有什么：姿势、正前方、脚下、头顶、结构、附近的活物与方块、背包里的东西。detail 选 brief（默认，只说关系）或 map（另给一张近细远粗的小图，问路时用）。不要凭印象编。"
parameters = '{ "type":"object", "properties":{ "detail":{ "type":"string", "enum":["brief","map"], "description":"brief = 只说关系（默认）；map = 另给一张近细远粗的小图，玩家问怎么过去时用" } } }'
script = "tools/entry.py"
timeout_ms = 15000

[[tools]]
name = "maid_see_screen"
examples = ["这里的风景好漂亮啊", "你看看这个！", "看一下我这里的画面", "我搭的东西你看见了吗", "看看我建的东西"]
description = "看一眼主人此刻屏幕上的画面，也就是自己眼前看到的样子。"
parameters = '{ "type":"object", "properties":{} }'
script = "tools/entry.py"
timeout_ms = 15000

# 连不上 MC 不该把整个插件自动禁用，只记原因。
[startup]
script = "hooks.py"
handler = "on_start"
required = false
retries = 2
retry_interval_ms = 5000
