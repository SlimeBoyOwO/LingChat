id = "mc_maid_bridge"
name = "车万女仆桥接"
description = "把《车万女仆》桥接模组接进对话：MC 里玩家说的话进对话，角色回的话变成游戏内女仆气泡，还能指挥女仆走过去、坐下、躺床、看过来"
version = "0.1.0"
author = "LingChat"

# 顶层键必须写在第一个表之前，否则会被解析成那个表的字段。
# MC 里玩家说的话要当成玩家发言送进对话。
send_user_message = true

# 游戏里的变化攒够了，要请角色主动开口（会花掉一轮生成）。
trigger_proactive = true

# 桥接模组只在本机回环上监听，白名单也只放行回环，避免这个插件被指向任意外部地址。
ws_allow = ["ws://127.0.0.1:", "ws://localhost:"]

[[config]]
key = "ws_url"
label = "桥接模组地址"
kind = "string"
required = false
default = "ws://127.0.0.1:48920"
hint = "与模组默认一致，一般不用改；模组改过端口才需要动。"

[[config]]
key = "maid_id"
label = "女仆 UUID"
kind = "string"
required = false
hint = "留空则每次用到都现问一遍游戏（每句话多一次往返，游戏暂停时最长等满 5 秒）。建议从模组面板复制填上。"

[[config]]
key = "player_name"
label = "你在 MC 里的用户名"
kind = "string"
required = false
hint = "比如 NoiQing_Ling。填上之后，游戏事件里出现这个名字就写成「玩家」，模型不会把它当成别人。\n留空也能用：接上游戏时的那句旁白里会写明玩家在游戏里叫什么。"

[[config]]
key = "echo_to_game"
label = "把角色的话同步成游戏内气泡"
kind = "boolean"
required = false
default = true

[[config]]
key = "proactive_after_events"
label = "攒够几条游戏事件让角色先开口"
kind = "number"
required = false
default = 3
hint = "游戏里的变化（换地形、天黑、下雨、受伤这类）会记成旁白；连着攒够这么多条、\n且这期间没人说话，就请角色主动说一句。填 0 = 只记旁白，不主动开口。\n只在设置里开着「主动对话系统」时才有效。"

[[ws]]
id = "tlm"
mode = "client"
url = "ws://127.0.0.1:48920"
auto_reconnect = true
script = "hooks.py"
handler = "on_ws"

# 订阅「这一句上屏了」而不是「这一句生成好了」：模型的回复是流式到达的，几条会
# 挤在一起生成完；跟着上屏时机走，游戏里的女仆才会跟着主界面一句一句地冒话。
[[subscribe]]
signal = "line_shown"
script = "hooks.py"
handler = "on_line_shown"

# 动作控制：让 LLM 指挥游戏里的女仆走过去、坐下、躺床、看过来。
# 五个工具都指向 hooks.py（一个脚本可挂多个入口，不必为每个工具新开文件）。
# 描述的第一句会进 tool_search 的清单，也会进 Tool RAG 的检索语料，所以要一句话说清能力。
[[tools]]
name = "maid_go_to"
description = "让女仆走到玩家身边或最近的床边。target 可选 player（玩家，默认）或 bed（最近的床）；走过去要花点时间，到位后会有旁白告诉你结果。"
parameters = '{ "type":"object", "properties":{ "target":{ "type":"string", "enum":["player","bed"], "description":"player = 走到玩家身边（默认）；bed = 走到最近的床边" } } }'
script = "hooks.py"
timeout_ms = 15000

[[tools]]
name = "maid_sit_down"
description = "让女仆坐下。坐下之后她不会自己走动，要她恢复行动用 maid_stand_up。"
parameters = '{ "type":"object", "properties":{} }'
script = "hooks.py"
timeout_ms = 15000

[[tools]]
name = "maid_stand_up"
description = "让女仆站起来。她坐着或躺着时用这个让她恢复行动。"
parameters = '{ "type":"object", "properties":{} }'
script = "hooks.py"
timeout_ms = 15000

[[tools]]
name = "maid_lie_down"
description = "让女仆走到床上躺下睡觉。她按自己的作息睡，不在睡觉时段会自己起来；附近没有床也会失败，工具会如实告诉你原因。"
parameters = '{ "type":"object", "properties":{ "target":{ "type":"string", "enum":["bed"], "description":"bed = 最近的床（默认也是唯一取值）" } } }'
script = "hooks.py"
timeout_ms = 15000

[[tools]]
name = "maid_look_at"
description = "让女仆转头看向玩家。只是转头看一眼，不会走过来。"
parameters = '{ "type":"object", "properties":{} }'
script = "hooks.py"
timeout_ms = 15000

# 连不上 MC 不该把整个插件自动禁用，只记原因。
[startup]
script = "hooks.py"
handler = "on_start"
required = false
retries = 2
retry_interval_ms = 5000
