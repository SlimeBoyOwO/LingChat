<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工具循环时序图 · Tool Loop</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16202c;
    --panel-2: #1b2430;
    --border: #2a3a4a;
    --text: #e6edf3;
    --muted: #8b98a5;
    --brand: #79d9ff;
    --rust: #f4a261;
    --vue: #34d399;
    --db: #a78bfa;
    --ok: #4ade80;
    --warn: #fbbf24;
    --tool: #f472b6;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .wrap { max-width: 1340px; margin: 0 auto; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>工具循环时序图（stream_with_tool_loop）</h1>
  <p class="sub">PR #523 · 一轮流式请求 → LLM 要工具 → 执行 → 结果回填 → 再请求，最多 3 轮；Content 逐字透传不中断</p>

  <svg viewBox="0 0 1320 1120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#79d9ff" />
      </marker>
      <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#f472b6" />
      </marker>
      <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#8b98a5" />
      </marker>
      <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#f4a261" />
      </marker>
    </defs>

    <!-- lifelines -->
    <text x="150" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#79d9ff">stream_with_tool_loop</text>
    <line x1="150" y1="50" x2="150" y2="1080" stroke="#79d9ff" stroke-width="1.3" stroke-dasharray="4 4" />
    <rect x="112" y="56" width="76" height="28" rx="6" fill="#1b2430" stroke="#79d9ff" />
    <text x="150" y="74" text-anchor="middle" font-size="11" fill="#79d9ff">tool_loop</text>

    <text x="430" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">LLM Provider</text>
    <line x1="430" y1="50" x2="430" y2="1080" stroke="#34d399" stroke-width="1.3" stroke-dasharray="4 4" />
    <rect x="388" y="56" width="84" height="28" rx="6" fill="#1b2430" stroke="#34d399" />
    <text x="430" y="74" text-anchor="middle" font-size="11" fill="#34d399">genai</text>

    <text x="700" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#f472b6">ToolExecutor</text>
    <line x1="700" y1="50" x2="700" y2="1080" stroke="#f472b6" stroke-width="1.3" stroke-dasharray="4 4" />
    <rect x="648" y="56" width="104" height="28" rx="6" fill="#1b2430" stroke="#f472b6" />
    <text x="700" y="74" text-anchor="middle" font-size="11" fill="#f472b6">executor</text>

    <text x="970" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#a78bfa">messages（本地上下文）</text>
    <line x1="970" y1="50" x2="970" y2="1080" stroke="#a78bfa" stroke-width="1.3" stroke-dasharray="4 4" />
    <rect x="918" y="56" width="104" height="28" rx="6" fill="#1b2430" stroke="#a78bfa" />
    <text x="970" y="74" text-anchor="middle" font-size="11" fill="#a78bfa">Vec&lt;LlmMessage&gt;</text>

    <text x="1200" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#f4a261">ToolRegistry / 权限</text>
    <line x1="1200" y1="50" x2="1200" y2="1080" stroke="#f4a261" stroke-width="1.3" stroke-dasharray="4 4" />
    <rect x="1144" y="56" width="112" height="28" rx="6" fill="#1b2430" stroke="#f4a261" />
    <text x="1200" y="74" text-anchor="middle" font-size="11" fill="#f4a261">registry</text>

    <!-- 分区：准备 -->
    <text x="30" y="112" font-size="12" font-weight="700" fill="#8b98a5">准备</text>
    <line x1="40" y1="120" x2="1280" y2="120" stroke="#2a3a4a" stroke-width="1" />
    <line x1="150" y1="140" x2="1200" y2="140" stroke="#f4a261" stroke-width="1.5" marker-end="url(#arrowOrange)" />
    <text x="660" y="132" text-anchor="middle" font-size="9.5" fill="#f4a261">allowed_tools(source, role_name) → 允许工具集</text>
    <line x1="150" y1="160" x2="1200" y2="160" stroke="#f4a261" stroke-width="1.5" marker-end="url(#arrowOrange)" />
    <text x="660" y="152" text-anchor="middle" font-size="9.5" fill="#f4a261">definitions_for_allowed(allowed) → 要下发的 ToolDefinition[]</text>
    <text x="670" y="176" text-anchor="middle" font-size="9.5" fill="#8b98a5">definitions 为空 或 provider 不支持流式工具 → 直接普通流式返回（跳过闭环）</text>

    <!-- 分区：Round 1 -->
    <text x="30" y="216" font-size="12" font-weight="700" fill="#f472b6">第 1 轮 · 流式请求带 tools</text>
    <line x1="40" y1="224" x2="1280" y2="224" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1" />

    <line x1="150" y1="244" x2="430" y2="244" stroke="#79d9ff" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="290" y="236" text-anchor="middle" font-size="9.5" fill="#79d9ff">complete_stream_with_tools(messages, definitions, "auto")</text>

    <path d="M 430 260 L 150 260" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="290" y="252" text-anchor="middle" font-size="9.5" fill="#34d399">┌─ Content("好的，我来查一下") ──透传→ content_tx</text>
    <path d="M 430 282 L 150 282" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="290" y="274" text-anchor="middle" font-size="9.5" fill="#34d399">├─ Content("现在几点？") ──透传→ content_tx</text>
    <path d="M 430 304 L 150 304" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrowPink)" />
    <text x="290" y="296" text-anchor="middle" font-size="9.5" fill="#f472b6">└─ 流结束 End → yield LlmChunk::ToolCalls([get_current_time])</text>

    <!-- 第1轮：有工具调用 -->
    <line x1="150" y1="324" x2="150" y2="344" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrowPink)" />
    <text x="290" y="338" text-anchor="middle" font-size="9.5" fill="#f472b6">本轮 tool_calls 非空 → 校验 id 非空且不重复 → 构造 assistant 消息</text>
    <path d="M 150 364 L 970 364" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="560" y="356" text-anchor="middle" font-size="9.5" fill="#a78bfa">messages.push(assistant{ content: 间隙文本, tool_calls }); tool_messages.push(同)</text>

    <line x1="150" y1="384" x2="700" y2="384" stroke="#79d9ff" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="425" y="376" text-anchor="middle" font-size="9.5" fill="#79d9ff">for call：executor.execute("get_current_time", "{}", context)</text>

    <rect x="700" y="402" width="150" height="26" rx="5" fill="#1b2430" stroke="#f472b6" stroke-opacity="0.5" />
    <text x="775" y="419" text-anchor="middle" font-size="9.5" fill="#f472b6">context.allows ✅ → 2s 超时执行</text>

    <path d="M 700 428 L 700 450" fill="none" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrowPink)" />
    <text x="960" y="430" text-anchor="middle" font-size="9.5" fill="#f472b6">返回 {local_time, timezone, unix_timestamp}</text>

    <path d="M 700 456 L 970 456" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="835" y="448" text-anchor="middle" font-size="9.5" fill="#a78bfa">messages.push(LlmMessage::tool_result(call.id, result)); tool_messages.push(同)</text>

    <!-- 分区：Round 2 -->
    <text x="30" y="496" font-size="12" font-weight="700" fill="#f472b6">第 2 轮 · 带工具历史再请求</text>
    <line x1="40" y1="504" x2="1280" y2="504" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1" />

    <line x1="150" y1="524" x2="430" y2="524" stroke="#79d9ff" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="290" y="516" text-anchor="middle" font-size="9.5" fill="#79d9ff">complete_stream_with_tools(messages[含 assistant(tool_calls)+tool(结果)], ...)</text>

    <path d="M 430 544 L 150 544" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="290" y="536" text-anchor="middle" font-size="9.5" fill="#34d399">Content("现在是 2026-08-02 14:30。") ──透传→ content_tx</text>
    <path d="M 430 566 L 150 566" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="290" y="558" text-anchor="middle" font-size="9.5" fill="#34d399">流结束 End → 无 ToolCalls → 工具循环结束</text>

    <line x1="150" y1="586" x2="150" y2="606" stroke="#79d9ff" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="470" y="600" text-anchor="middle" font-size="9.5" fill="#79d9ff">drop(content_tx) → 返回 ToolLoopResult{ stream: content_rx 合并流, tool_messages }</text>

    <!-- 后续 -->
    <text x="30" y="646" font-size="12" font-weight="700" fill="#8b98a5">循环之后（run_pipeline）</text>
    <line x1="40" y1="654" x2="1280" y2="654" stroke="#2a3a4a" stroke-width="1" />

    <line x1="970" y1="674" x2="970" y2="694" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="1190" y="688" text-anchor="middle" font-size="9.5" fill="#a78bfa">tool_messages（assistant + tool 交替）按序写入 line_list</text>
    <text x="1190" y="704" text-anchor="middle" font-size="9.5" fill="#a78bfa">assistant 行：content + tool_call JSON</text>
    <text x="1190" y="720" text-anchor="middle" font-size="9.5" fill="#a78bfa">tool 行：{tool_call_id, result}（对玩家不可见）</text>

    <line x1="970" y1="722" x2="970" y2="744" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="1190" y="752" text-anchor="middle" font-size="9.5" fill="#34d399">refresh_memories → MemoryBuilder 重建 role.memory</text>

    <line x1="150" y1="760" x2="150" y2="780" stroke="#79d9ff" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="470" y="774" text-anchor="middle" font-size="9.5" fill="#79d9ff">最终回复流 = tool_loop_result.stream → producer/consumer → add_assistant_line</text>

    <text x="30" y="818" font-size="12" font-weight="700" fill="#f4a261">错误路径（都在 executor 层稳定编码，不向上抛）</text>
    <line x1="40" y1="826" x2="1280" y2="826" stroke="#f4a261" stroke-opacity="0.4" stroke-width="1" />

    <rect x="120" y="844" width="260" height="42" rx="7" fill="#1c1a16" stroke="#f4a261" stroke-opacity="0.5" />
    <text x="250" y="862" text-anchor="middle" font-size="10" fill="#f4a261">context.allows 失败 → tool_not_allowed</text>
    <text x="250" y="878" text-anchor="middle" font-size="9" fill="#8b98a5">作为 tool 结果回填给 LLM</text>
    <rect x="400" y="844" width="260" height="42" rx="7" fill="#1c1a16" stroke="#f4a261" stroke-opacity="0.5" />
    <text x="530" y="862" text-anchor="middle" font-size="10" fill="#f4a261">注册表找不到 → unknown_tool</text>
    <text x="530" y="878" text-anchor="middle" font-size="9" fill="#8b98a5">参数解析失败 → invalid_json / invalid_arguments</text>
    <rect x="680" y="844" width="260" height="42" rx="7" fill="#1c1a16" stroke="#f4a261" stroke-opacity="0.5" />
    <text x="810" y="862" text-anchor="middle" font-size="10" fill="#f4a261">工具返回 Err → tool_error</text>
    <text x="810" y="878" text-anchor="middle" font-size="9" fill="#8b98a5">超过 2 秒 → timeout</text>
    <rect x="960" y="844" width="260" height="42" rx="7" fill="#1c1a16" stroke="#f4a261" stroke-opacity="0.5" />
    <text x="1090" y="862" text-anchor="middle" font-size="10" fill="#f4a261">轮次耗尽（3 轮还有工具调用）</text>
    <text x="1090" y="878" text-anchor="middle" font-size="9" fill="#8b98a5">→ 硬报错，终止生成</text>

    <!-- 底部说明 -->
    <rect x="120" y="916" width="1100" height="120" rx="10" fill="#16202c" stroke="#f472b6" stroke-opacity="0.4" />
    <text x="150" y="944" font-size="12" font-weight="700" fill="#f472b6">关键设计</text>
    <text x="150" y="968" font-size="10.5" fill="#e6edf3">· Content 逐字透传：工具调用间隙模型说的话不中断，调用方拿到的是一条「所有轮次内容拼接」的流。</text>
    <text x="150" y="990" font-size="10.5" fill="#e6edf3">· 工具调用只在流结束后执行：流式 API 必须等 End 事件才能拿到捕获完整的参数（captured_into_tool_calls）。</text>
    <text x="150" y="1012" font-size="10.5" fill="#e6edf3">· 回填的消息同时进 messages（本轮用）与 tool_messages（落台词表用），两路同构。</text>
    <text x="150" y="1034" font-size="10.5" fill="#e6edf3">· 非流式工具 Provider（如 kimi_code）直接跳过整个闭环，回到普通单次流式，不做非流式预检。</text>
  </svg>

  <div class="legend">
    <span><span class="dot" style="background:#79d9ff"></span>流式请求 / 透传</span>
    <span><span class="dot" style="background:#34d399"></span>Content / 结果回传</span>
    <span><span class="dot" style="background:#f472b6"></span>ToolCalls / 执行</span>
    <span><span class="dot" style="background:#a78bfa"></span>上下文回填</span>
    <span><span class="dot" style="background:#f4a261"></span>权限 / 错误路径</span>
  </div>
</div>
</body>
</html>
