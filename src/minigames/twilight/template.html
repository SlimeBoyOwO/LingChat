<div class="cadence-root" data-state="loading">
  <img id="scene-background" class="scene-background" alt="" draggable="false" />
  <div class="scene-shade" aria-hidden="true"></div>
  <div id="scene-corruption" class="scene-corruption" aria-hidden="true"></div>
  <canvas id="game" width="960" height="540" aria-label="四键音游，触摸下方四键或使用 D F J K 点按或长按"></canvas>
  <div class="loading" id="loading">正在载入场景…</div>

  <div class="title-card" id="title-card" hidden>
    <div class="scene-title">
      <h1>暮色节拍</h1>
      <div class="song-picker" role="group" aria-label="选择曲目">
        <button id="song-prev" type="button" aria-label="上一首曲目">‹</button>
        <strong id="song-title" aria-live="polite">灯下回声</strong>
        <button id="song-next" type="button" aria-label="下一首曲目">›</button>
      </div>
      <p id="song-details" class="song-details"></p>
    </div>
    <nav class="scene-menu" aria-label="音游菜单">
      <button class="menu-item" id="start" type="button">开始演奏</button>
      <button class="menu-item" id="demo" type="button">观赏演示</button>
      <button class="menu-item" id="settings-toggle" type="button" aria-expanded="false">调校</button>
      <button class="menu-item" id="back-to-games" type="button">返回</button>
    </nav>
    <p class="scene-hint"><b id="play-hint">D / F / J / K · 点按或长按</b> <span id="track-summary">112 BPM · 约 72 秒</span></p>
  </div>

  <div class="live-tools" id="live-tools" hidden>
    <span id="mode-label">演奏中</span>
    <button id="pause" type="button" aria-label="暂停游戏">暂停</button>
  </div>
  <div class="touch-keys" id="touch-keys" aria-label="轨道触摸按键">
    <button data-lane="0" style="--lane:0;--lane-color:#f2acb5" aria-label="轨道 D"><span>D</span></button>
    <button data-lane="1" style="--lane:1;--lane-color:#f7d39a" aria-label="轨道 F"><span>F</span></button>
    <button data-lane="2" style="--lane:2;--lane-color:#9fd0d4" aria-label="轨道 J"><span>J</span></button>
    <button data-lane="3" style="--lane:3;--lane-color:#c6b5ea" aria-label="轨道 K"><span>K</span></button>
  </div>

  <div class="modal-scrim" id="pause-screen" hidden>
    <section class="modal pause-menu" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <h2 id="pause-title">暂停</h2>
      <div class="modal-actions">
        <button class="menu-item" id="resume" type="button">继续演奏</button>
        <button class="menu-item" id="restart-paused" type="button">重新开始</button>
        <button class="menu-item" id="pause-settings" type="button">调校</button>
        <button class="menu-item" id="leave" type="button">返回曲目</button>
        <button class="menu-item" id="exit-paused" type="button">退出小游戏</button>
      </div>
      <p class="pause-hint">继续前会准备三拍</p>
    </section>
  </div>

  <div class="modal-scrim" id="result-screen" hidden>
    <section class="modal result" role="dialog" aria-modal="true" aria-labelledby="result-title">
      <p class="eyebrow" id="result-eyebrow">演奏完成</p>
      <p class="result-song" id="result-song"></p>
      <h2 id="result-title">最后一盏灯，为你亮着</h2>
      <div class="result-grade" id="result-grade">A</div>
      <p id="result-copy"></p>
      <div class="result-stats">
        <div><strong id="result-accuracy">0%</strong><span>准确率</span></div>
        <div><strong id="result-combo">0</strong><span>最大连击</span></div>
        <div><strong id="result-miss">0</strong><span>漏击</span></div>
      </div>
      <div class="result-actions"><button class="menu-item" id="retry" type="button">再演奏一次</button><button class="menu-item" id="result-leave" type="button">返回曲目</button></div>
    </section>
  </div>

  <div class="modal-scrim settings-scrim" id="settings" hidden>
    <section class="modal settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">调校</h2>
      <label>音乐音量 <output id="volume-value">55%</output><input id="volume" type="range" min="0" max="100" value="55"></label>
      <label>输入偏移 <output id="offset-value">0 ms</output><input id="offset" type="range" min="-200" max="200" step="5" value="0"><small>总是按晚了可向正值调整。</small></label>
      <label>下落时间 <output id="speed-value">1.8 s</output><input id="speed" type="range" min="1.1" max="2.6" step="0.1" value="1.8"><small>只改变视觉速度，不改变音乐。</small></label>
      <label class="check-setting"><input id="horror" type="checkbox"><span>异常演出<small>后段色彩错位、角色残影，尾声进入剧情错误。</small></span></label>
      <label class="check-setting"><input id="beat-effects" type="checkbox" checked><span>节拍特效<small>霓虹光束、打击扩散和连击效果，跟随系统减少动态效果设置。</small></span></label>
      <button id="settings-close" class="menu-item" type="button">返回</button>
    </section>
  </div>
  <span id="footer-status" class="sr-only" aria-live="polite">场景已就绪</span>
</div>
