<div class="cadence-root">
  <main class="shell">
    <header class="masthead">
      <div class="brand"><span class="pixel-mark" aria-hidden="true">✦</span><span>暮色节拍<small>TWILIGHT CADENCE</small></span></div>
      <div class="edition"><span class="status-light"></span>像素节奏<span class="edition-no">01 / SHRINE</span><button id="back-to-games" class="quiet" type="button">← 小游戏</button></div>
    </header>
    <section class="game-frame" aria-label="暮色神社节奏游戏">
      <canvas id="game" width="960" height="540" aria-label="四键音游画面，使用 D F J K 或下方触摸按键操作"></canvas>
      <div class="loading" id="loading">正在点亮灯笼…</div>
      <div class="title-card" id="title-card" hidden>
        <p class="eyebrow">一首歌 · 一座神社 · 一次练习</p>
        <h1>让记忆<br>跟上节拍<span>。</span></h1>
        <p class="intro">和钦灵一起，把暮色留在最后一拍。<br>音符落到光线时，按下对应的键。</p>
        <div class="start-actions"><button class="primary" id="start">开始演奏 <span>↗</span></button><button class="quiet" id="demo">观赏演示</button></div>
        <div class="title-keys"><kbd>D</kbd><kbd>F</kbd><span>·</span><kbd>J</kbd><kbd>K</kbd><small>单点 / 长按</small></div>
      </div>
      <div class="live-tools" id="live-tools" hidden><span id="mode-label">演奏中</span><button id="pause" aria-label="暂停游戏">Ⅱ 暂停</button></div>
      <div class="modal-scrim" id="pause-screen" hidden>
        <div class="modal"><p class="eyebrow">TAKE A BREATH</p><h2>节拍在这里等你</h2><p>切出窗口会自动暂停。<br>继续后先准备三拍，再接上音乐。</p><div class="modal-actions"><button class="primary" id="resume">继续演奏</button><button class="quiet" id="restart-paused">重新开始</button><button class="quiet" id="leave">返回庭院</button></div></div>
      </div>
      <div class="modal-scrim" id="result-screen" hidden>
        <div class="modal result"><p class="eyebrow" id="result-eyebrow">THE LAST LANTERN</p><h2 id="result-title">最后一盏灯，为你亮着</h2><div class="result-grade" id="result-grade">A</div><p id="result-copy"></p><div class="result-stats"><div><strong id="result-accuracy">0%</strong><span>准确率</span></div><div><strong id="result-combo">0</strong><span>最大连击</span></div><div><strong id="result-miss">0</strong><span>漏击</span></div></div><div class="modal-actions"><button class="primary" id="retry">再演奏一次</button><button class="quiet" id="result-leave">返回庭院</button></div></div>
      </div>
      <div class="canvas-border" aria-hidden="true"></div>
    </section>
    <section class="below-stage">
      <div class="track-info"><span class="disc" aria-hidden="true">♫</span><div><h2>灯下回声 <span>原创练习曲</span></h2><p>112 BPM <i>·</i> 约 72 秒 <i>·</i> 4 KEYS</p></div></div>
      <div class="touch-keys" aria-label="触摸或鼠标按键"><button data-lane="0" aria-label="轨道 D">D</button><button data-lane="1" aria-label="轨道 F">F</button><button data-lane="2" aria-label="轨道 J">J</button><button data-lane="3" aria-label="轨道 K">K</button></div>
      <button class="settings-toggle quiet" id="settings-toggle" aria-expanded="false">调校 <span>☷</span></button>
    </section>
    <section class="settings" id="settings" hidden aria-label="游戏调校">
      <label>音乐音量 <output id="volume-value">55%</output><input id="volume" type="range" min="0" max="100" value="55"></label>
      <label>输入偏移 <output id="offset-value">0 ms</output><input id="offset" type="range" min="-200" max="200" step="5" value="0"><small>总是按晚了可向正值调整。</small></label>
      <label>下落时间 <output id="speed-value">1.8 s</output><input id="speed" type="range" min="1.1" max="2.6" step="0.1" value="1.8"><small>只改变视觉速度，不改变音乐。</small></label>
      <label class="check-setting"><input id="horror" type="checkbox"><span>异常演出<small>后段色彩错位、角色残影；尾声转入剧情错误。无突然巨响。</small></span></label>
    </section>
    <footer><span>按 <kbd>Esc</kbd> 暂停 <span class="footer-dot">·</span> 长条音符请按住到尾端</span><span id="footer-status">庭院已就绪</span></footer>
  </main>

</div>
