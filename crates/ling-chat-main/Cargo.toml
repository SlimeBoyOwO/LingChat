[package]
name = "ling-chat-main"
version.workspace = true
description = "LingChat 业务主 crate：api / ai_service / db / config / utils 等"
authors = ["LingChat Team"]
edition = "2021"

# lib 名带连字符转下划线，避免与外壳 bin 名冲突（同 Windows 上的历史处理）。
[lib]
name = "ling_chat_main"

[dependencies]
ling-chat-notes = { path = "../ling-chat-notes" }
# macos-private-api：macOS 上透明窗口（桌宠模式）的必要条件，缺失时 tauri.conf.json
# 的 transparent 会被静默忽略。该 feature 由 cfg(target_os = "macos") 门控。
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-screenshots = { path = "../../src-tauri/plugins/tauri-plugin-screenshots" }
tauri-plugin-android-fs = "28"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = "1"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
thiserror = "2"
reqwest = { workspace = true }
rustls = { workspace = true }
webpki-roots = "0.26"
futures-util = { workspace = true }
futures-executor = "0.3"
async-stream = "0.3"
bytes = "1"
regex = "1"
genai = "0.7.0-rc.8"
uuid = { workspace = true }
async-trait = { workspace = true }
tokio-tungstenite = { workspace = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
] }
ndarray = "0.17"

sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = [
    "std",
] }
once_cell = "1"
base64 = { workspace = true }
rand = "0.8"
indoc = "2"

image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }
infer = "0.19"
sevenz-rust2 = "0.21"
sha2 = "0.10"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
# 参考音频导入：sherpa-onnx 只吃 16-bit PCM WAV，用 symphonia 解码任意常见音频后
# 交给 hound 重编码（见 utils::audio）。只开需要的容器/编码，别把整个 all 拉进来。
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "aiff",
    "alac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
hound = "3.5"
# Opus 解码：symphonia 0.5 没有 Opus 解码器，而 `.ogg` / `.opus` 里塞 Opus 极常见
# （Telegram / WhatsApp 的语音消息）。opusic-sys 默认 bundled：自带 libopus 源码、
# 用 cmake 编成静态库，不需要预编译产物，也不用往 Android 的 jniLibs 塞 .so
# （Android 交叉编译靠 ANDROID_NDK_HOME，见 scripts/resolve-android-ndk.mjs）。
# 许可证 BSD-3-Clause，无 GPL 问题。
opus = "0.4"

# LAN Sync
axum = { workspace = true }
mdns-sd = "0.11"
if-addrs = "0.13"
tokio-util = { workspace = true }

# Skill Agent：命令输出在中文 Windows 上是 GBK，需要回退解码
encoding_rs = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "directml",
    "load-dynamic",
] }
sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = [
    "directml",
] }
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_Threading",
] }
# sherpa-onnx 的链接方式（static / shared）由 Cargo feature 决定，见文件末尾的
# [features]：默认（都不开）上游 build.rs 就是 static，Windows 的 DirectML 变体走
# sherpa-shared。
sherpa-onnx = { version = "=1.13.5", default-features = false }
sherpa-onnx-sys = { version = "=1.13.5", default-features = false }

[target.'cfg(any(target_os = "linux", all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
# GPU 性能分级：Linux 走 Vulkan、macOS(x86_64) 走 Metal（WebGPU / wgpu）
wgpu = "26"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "webgpu",
    "download-binaries",
] }
sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = [
    "webgpu",
] }
ash = { version = "0.38", default-features = false, features = ["loaded"] }
sherpa-onnx = { version = "=1.13.5", default-features = false }
# sherpa-onnx 1.13.5 的 Rust 代码对 sys 1.13.6 头文件不兼容（缺 window_shift_ratio），
# 必须钉在 1.13.5，避免 cargo 解析到更新版导致编译失败。
sherpa-onnx-sys = { version = "=1.13.5", default-features = false }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
# 与 x86_64 不同：aarch64 无 AVX2 问题，直接静态链接官方/预编译二进制即可
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["download-binaries"] }
# sherpa-onnx 的 sys 包里有 `linux-aarch64-static-lib` 的官方预编译包，之前只在
# x86_64 / macOS / Android 下声明了依赖，arm64 Linux 构建直接 unresolved import。
sherpa-onnx = { version = "=1.13.5", default-features = false }
sherpa-onnx-sys = { version = "=1.13.5", default-features = false }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "coreml",
    "download-binaries",
] }
sbv2_core = { git = "https://gh-proxy.org/github.com/shadow01a/sbv2-api/", default-features = false, features = [
    "coreml",
] }
sherpa-onnx = { version = "=1.13.5", default-features = false }
# 钉 sys 1.13.5 与 crate 匹配（见 linux-x86_64 块的注释）
sherpa-onnx-sys = { version = "=1.13.5", default-features = false }

# Sherpa-ONNX: Android 只支持 shared 链接（.so），桌面默认走 static（见 [features]）
[target.'cfg(target_os = "android")'.dependencies]
sherpa-onnx = { version = "=1.13.5", default-features = false, features = ["shared"] }
sherpa-onnx-sys = { version = "=1.13.5", default-features = false }

[features]
# 桌面端的链接方式由 Cargo feature 决定：sherpa-onnx-sys 的 build.rs 里 static /
# shared 同时开是硬报错（`Features \`static\` and \`shared\` cannot be enabled at
# the same time`），所以不能像以前那样在 build.rs 里按环境变量把 static 顶掉。
#
#   - 默认（都不开）：上游 build.rs 落回 Static。Windows/Linux/macOS 的 CPU 构建
#     都是这样（避免运行时缺 DLL/.so）。
#   - Windows DirectML 变体：`--features sherpa-shared`，配合
#     scripts/build-desktop-sherpa-dml.mjs 导出的 SHERPA_ONNX_LIB_DIR（自编的
#     DirectML 版动态库；运行期复用应用随包的 onnxruntime.dll）。
#     `pnpm tauri:build:win` 会把这两步串起来。
sherpa-shared = ["sherpa-onnx/shared", "sherpa-onnx-sys/shared"]

[dev-dependencies]
# 测试里自造 OGG/Opus 素材（配合 opus 的编码器），避免提交二进制 fixture。
ogg = "0.9"
