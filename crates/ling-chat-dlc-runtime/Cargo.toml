[package]
name = "ling-chat-dlc-runtime"
version = "0.3.1"
edition = "2021"
license = "AGPL-3.0-only"
description = "LingChat game sessions and native story extension"
[dependencies]
ling-chat-main = { path = "../ling-chat-main" }
ling-chat-plugins = { path = "../ling-chat-plugins" }
ling-chat-dlc-contract = { workspace = true }
async-trait = { workspace = true }
sea-orm = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
rand = "0.8"
base64 = { workspace = true }
sha2 = "0.10"
semver = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "unstable"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_Controls", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading",
    "Win32_System_LibraryLoader"
] }
