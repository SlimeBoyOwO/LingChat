[package]
name = "ling-chat-plugins"
version.workspace = true
description = "LingChat 插件系统 crate：PluginManager + RustPython 脚本后端"
authors = ["LingChat Team"]
edition = "2021"

[lib]
name = "ling_chat_plugins"

[dependencies]
ling-chat-main = { path = "../ling-chat-main" }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# 插件系统：嵌入 RustPython 跑插件 Python 脚本（受限沙箱）。
rustpython-vm = { version = "0.5", default-features = false, features = [
    "compiler",
    "gc",
    "stdio",
    "serde",
    "freeze-stdlib",
] }
rustpython-pylib = { version = "0.5", features = ["freeze-stdlib"] }
rustpython-derive = "0.5"
