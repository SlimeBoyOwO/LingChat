[package]
name = "ling-chat-plugins"
version = "0.5.2"
description = "LingChat 插件系统 crate：PluginManager + RustPython 脚本后端"
authors = ["LingChat Team"]
edition = "2021"

[lib]
name = "ling_chat_plugins"

[dependencies]
ling-chat-main = { path = "../ling-chat-main" }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-trait = "0.1"
axum = { version = "0.7", features = ["tokio", "ws"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.13", features = [
    "json",
    "form",
    "multipart",
    "query",
    "stream",
    "rustls",
    "system-proxy",
], default-features = false }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"

# 插件系统：嵌入 RustPython 跑插件 Python 脚本（受限沙箱）。
rustpython-vm = { version = "0.5", default-features = false, features = [
    "compiler",
    "gc",
    "stdio",
    "serde",
    "freeze-stdlib",
] }
rustpython-pylib = { version = "0.5", features = ["freeze-stdlib"] }
rustpython-derive = "0.5"
