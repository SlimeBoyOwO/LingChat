[package]
name = "ling-chat-plugins"
version.workspace = true
description = "LingChat 插件系统 crate：PluginManager + RustPython 脚本后端"
authors = ["LingChat Team"]
edition = "2021"

[lib]
name = "ling_chat_plugins"

[dependencies]
ling-chat-main = { path = "../ling-chat-main" }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# 插件系统：嵌入 RustPython 跑插件 Python 脚本（受限沙箱）。
rustpython-vm = { version = "0.5", default-features = false, features = [
    "compiler",
    "gc",
    "stdio",
    "serde",
    "freeze-stdlib",
    # Android bionic 只有 128 个 TLS key；RustPython 默认给每个内建类型各开一个
    # thread_local，解释器还没建完就会 "out of TLS keys" abort。开启 threading
    # 后 StaticCell 改用全局 OnceLock，不再按类型消耗 TLS key。
    "threading",
] }
rustpython-pylib = { version = "0.5", features = ["freeze-stdlib"] }
rustpython-derive = "0.5"

[dev-dependencies]
tempfile = "3"
